<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAiDay | Analisis Avanzado</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <main class="container">
    <nav class="top-nav">
      <a href="/" class="small-link">Home</a>
      <a href="/precios" class="small-link">Prediccion de precios</a>
      <a href="/mapas" class="small-link">Explorador de mapas</a>
    </nav>

    <header class="page-header">
      <h1>Analisis Avanzado</h1>
      <p>Ejecuta clasificadores de texto e imagen desde una interfaz dedicada.</p>
    </header>

    <section class="analysis-grid">
      <article class="model-card">
        <h2>Clasificador de texto</h2>
        <form id="texto-form" class="form-grid">
          <label>
            Descripcion
            <textarea name="texto" rows="6" placeholder="Describe el anuncio..." required></textarea>
          </label>
          <button type="submit">Clasificar texto</button>
        </form>
        <article class="result-card" id="texto-result-card">
          <p class="result-label">Resultado</p>
          <p id="texto-result" class="result-value">Introduce un texto para clasificar.</p>
        </article>
      </article>

      <article class="model-card">
        <h2>Clasificador de imagen</h2>
        <form id="imagen-form" class="form-grid">
          <label class="dropzone" id="dropzone" for="imagen-file">
            <input id="imagen-file" name="file" type="file" accept="image/*" required>
            <span id="dropzone-text">Arrastra una imagen aqui o haz click para seleccionar.</span>
          </label>
          <button type="submit">Clasificar imagen</button>
        </form>
        <article class="result-card" id="imagen-result-card">
          <p class="result-label">Resultado</p>
          <p id="imagen-result" class="result-value">Sube una imagen para clasificar.</p>
        </article>
      </article>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
