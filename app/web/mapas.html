<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAiDay | Explorador de Mapas</title>
  <meta name="description" content="Visualiza datos inmobiliarios de Madrid sobre mapas interactivos por barrios, secciones censales y hexágonos H3.">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
</head>
<body class="map-body">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <!-- ── Navegación ─────────────────────────────────── -->
  <nav class="site-nav" id="site-nav">
    <a href="/" class="site-nav__logo">M<span>Ai</span>Day</a>
      <ul class="site-nav__links">
        <li><a href="/">Inicio</a></li>
        <li><a href="/precios">Predicción de Precios</a></li>
        <li><a href="/analisis">Análisis Avanzado</a></li>
        <li><a href="/mapas" class="active">Mapas</a></li>
      </ul>
</nav>

  <!-- ── Panel de controles ─────────────────────────── -->
  <aside class="map-controls" id="map-controls">
    <h2 class="map-controls-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      Configuración
    </h2>

    <label class="map-label" for="rejilla-select">
      Tipo de rejilla
      <select id="rejilla-select" class="map-select">
        <option value="">Cargando…</option>
      </select>
    </label>

    <label class="map-label" for="categoria-select">
      Categoría
      <select id="categoria-select" class="map-select">
        <option value="">Todas</option>
      </select>
    </label>

    <label class="map-label" for="variable-select">
      Variable a visualizar
      <select id="variable-select" class="map-select">
        <option value="">Cargando…</option>
      </select>
    </label>

    <div class="map-stats" id="map-stats">
      <p class="map-stats-row"><span class="map-stats-label">Zonas:</span> <span id="stat-zonas">—</span></p>
      <p class="map-stats-row"><span class="map-stats-label">Min:</span> <span id="stat-min">—</span></p>
      <p class="map-stats-row"><span class="map-stats-label">Max:</span> <span id="stat-max">—</span></p>
      <p class="map-stats-row"><span class="map-stats-label">Media:</span> <span id="stat-media">—</span></p>
    </div>
  </aside>

  <!-- ── Mapa ────────────────────────────────────────── -->
  <div id="map" class="map-container"></div>

  <!-- ── Leyenda ─────────────────────────────────────── -->
  <div class="map-legend" id="map-legend"></div>

  <!-- ── Tooltip ─────────────────────────────────────── -->
  <div class="map-tooltip" id="map-tooltip"></div>

  <!-- ── Spinner ─────────────────────────────────────── -->
  <div class="map-loading" id="map-loading">
    <div class="map-spinner"></div>
    <p>Cargando datos…</p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
  <script src="/static/mapas.js"></script>
</body>
</html>
